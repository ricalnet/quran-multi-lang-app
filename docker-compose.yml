services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:7000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${WEB_TMPFS_TMP}
      - /app/.next/cache:rw,noexec,nosuid,size=${WEB_TMPFS_CACHE}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPU_LIMIT}"
          memory: ${WEB_MEM_LIMIT}
          pids: ${WEB_PIDS_LIMIT}
        reservations:
          memory: ${WEB_MEM_RESERVATION}

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:7001:8000"
    volumes:
      - ./resources:/resources:ro
    environment:
      - RESOURCES_PATH=/resources
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${API_TMPFS_TMP}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT}"
          memory: ${API_MEM_LIMIT}
          pids: ${API_PIDS_LIMIT}
        reservations:
          memory: ${API_MEM_RESERVATION}

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${REDIS_TMPFS_TMP}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --protected-mode yes
      --maxmemory ${REDIS_MAXMEMORY}
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT}"
          memory: ${REDIS_MEM_LIMIT}
          pids: ${REDIS_PIDS_LIMIT}
        reservations:
          memory: ${REDIS_MEM_RESERVATION}

volumes:
  redis-data: